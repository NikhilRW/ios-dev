name: iOS development session

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-ios-development-session
  cancel-in-progress: false

jobs:
  develop:
    runs-on: macos-26
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - name: Record session clock
        run: |
          date +%s > "$RUNNER_TEMP/helloios-start-epoch.txt"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate runner, Xcode, runtimes, and GitHub SSH keys
        env:
          SESSION_ACTOR: ${{ github.actor }}
          ATTEMPT_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .dev-session
          cp "$RUNNER_TEMP/helloios-start-epoch.txt" .dev-session/start-epoch.txt
          [[ "$(uname -m)" == arm64 ]] || { echo 'macos-26 must be arm64 for serve-sim.' >&2; exit 1; }
          xcode-select -p
          xcodebuild -version
          xcrun --find simctl
          xcrun simctl list runtimes --json > .dev-session/runtimes.json
          python3 - <<'PY'
          import json
          with open('.dev-session/runtimes.json') as f:
              runtimes = json.load(f)['runtimes']
          available = [r for r in runtimes if r.get('isAvailable') and '.iOS-' in r['identifier'] and int(r['version'].split('.')[0]) >= 17]
          if not available:
              raise SystemExit('No installed available iOS >=17 runtime. Check the macos-26 image/Xcode selection; startup does not download runtimes.')
          print('Available iOS runtimes:', ', '.join(r['name'] for r in available))
          PY
          for actor in "$SESSION_ACTOR" "$ATTEMPT_ACTOR"; do
            [[ "$actor" =~ ^[A-Za-z0-9-]+$ ]] || { echo 'A human GitHub actor with registered SSH authentication keys is required.' >&2; exit 1; }
            curl -fLsS --retry 3 --connect-timeout 10 --max-time 40 "https://github.com/$actor.keys" -o .dev-session/actor.keys
            ssh-keygen -l -f .dev-session/actor.keys > /dev/null 2>&1 || {
              echo "No usable GitHub SSH keys for $actor. Add a public authentication key to that GitHub account." >&2
              exit 1
            }
            echo "GitHub SSH keys available for $actor."
          done
          rm -f .dev-session/actor.keys

      - name: Configure Node LTS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.22.1
          architecture: arm64
          package-manager-cache: false

      - name: Install pinned host tools
        run: bash scripts/bootstrap-tools.sh

      - name: Generate and inspect project (no compilation)
        run: bash scripts/prepare-project.sh

      - name: Select and boot installed simulator
        run: bash scripts/boot-simulator.sh

      - name: Start authenticated preview and HTTPS tunnel
        run: bash scripts/start-preview.sh

      - name: Publish connection instructions
        run: |
          set -euo pipefail
          url="$(cat .dev-session/tunnel-url.txt)"
          echo "Preview ready (bare URL): $url"
          echo 'Wait for the SSH command in the next step. In SSH: cd "$GITHUB_WORKSPACE"'
          echo 'Then: bash scripts/preview-url.sh (private URL), bash scripts/build-run.sh (manual build).'
          echo 'The 300-minute job limit includes all setup. Exit the hosted shell or cancel the workflow to stop early.'
          {
            echo '## iOS development session'
            echo "Bare preview URL (authentication required): $url"
            echo 'Use the SSH command in the live Upterm step logs.'
            echo 'In SSH: `cd "$GITHUB_WORKSPACE"`, then `bash scripts/preview-url.sh`.'
            echo 'Build manually: `bash scripts/build-run.sh`. Initial preview is the simulator Home screen.'
            echo '300 minutes total including setup; save source edits before ending the session.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Interactive Upterm session
        uses: owenthereal/action-upterm@b9dfa526f890bbd5162d781f8d9c69b97731d73d # v2.7.0
        env:
          SHELL: /bin/bash
        with:
          limit-access-to-actor: true
          detached: false
          wait-timeout-minutes: 0
          upterm-version: v0.39.0

      - name: Stop preview and tunnel
        if: ${{ always() }}
        run: bash scripts/cleanup.sh

# native-sim-template-version: 34
# Generated by `native-sim init`. Boots an iOS Simulator on a GitHub-hosted macOS
# runner, builds the selected app into it, and streams it back over a tunnel using
# @expo/serve-sim. The tunnel URL is published as a commit status, which is the
# only GitHub surface readable *while* the job is still running.
name: native-sim
run-name: native-sim ${{ inputs.session }} · ${{ inputs.framework }} · ${{ inputs.mode }} · ${{ inputs.minutes }}m

on:
  workflow_dispatch:
    inputs:
      session:
        description: Session id (used to correlate the run with the local CLI)
        required: true
      gate_token:
        description: Shared secret for a local-source run
        default: ""
      source:
        description: Encrypted source checkout request (set by native-sim)
        default: ""
      minutes:
        description: How long to hold the stream open
        default: "30"
      device:
        description: Simulator device name
        default: iPhone 17 Pro
      mode:
        description: build (simulator), app (prebuilt simulator app), go (Expo Go), or ipa (iPhone only)
        default: build
      framework:
        description: expo, react-native, or native (SwiftUI/UIKit Xcode project)
        default: expo
      project_dir:
        description: Selected app directory relative to the repository root
        default: "."
      dev:
        description: Build a Debug app (native iOS) or Metro development app (build mode only)
        default: "false"
      dev_url:
        description: Expo dev-client link or HTTPS Metro tunnel URL for React Native CLI (build mode only)
        default: ""
      ssh:
        description: Enable an Upterm SSH session on the runner
        default: "false"
      app_url:
        description: URL of a prebuilt simulator .app archive (mode:app)
        default: ""
      app_release_asset:
        description: >-
          Asset name on this repo's `native-sim-build` release to install
          (mode:app). Fetched with the job's own GITHUB_TOKEN, so a private repo
          needs no extra credentials and nothing is publicly downloadable.
        default: ""
      transport:
        description: >-
          http (default) or webrtc. webrtc needs a TURN relay, which is a paid,
          per-GB service, and measured no better than http here — opt in only.
        default: http
      codec:
        description: HTTP stream codec. h264 serves /stream.avcc, which emits nothing on
          GitHub runners; mjpeg is what actually streams.
        default: mjpeg
      max_dimension:
        description: Cap the captured width/height in pixels; 0 keeps native resolution.
          640 was measurably snappier but visibly soft on a retina display, where the
          preview is drawn at ~2x CSS pixels. 900 keeps it sharp.
        default: "900"
      video_fps:
        description: MJPEG frame rate. serve-sim defaults to 60, which over a tunnel
          stutters more than a reliably delivered 30 and doubles encode CPU.
        default: "30"
      video_quality:
        description: MJPEG quality 0.05-1. Lower means fewer bytes per frame, but it shows
          as compression artefacts rather than softness — reduce fps or dimension first.
        default: "0.7"
      export_app:
        description: Upload the built .app as an artifact so it can be downloaded
        default: "false"
      export_ipa:
        description: Build and export an unsigned device IPA (Expo or native iOS)
        default: "false"
      agent_device:
        description: >-
          Also run an agent-device proxy beside the simulator, reachable at
          <url>/agent-device, so a coding agent on your machine can drive the app.
        default: "false"
      agent_device_version:
        description: agent-device version to install. Pin it — the client and the
          proxied daemon should match.
        default: 0.20.1
      scheme:
        description: Xcode scheme (defaults to the workspace or project name)
        default: ""
      cache:
        description: Reuse dependencies, Xcode build data, and fingerprint-matched simulator apps
        default: "true"
      runner:
        description: Runner label (must be arm64 — serve-sim ships arm64-only binaries)
        default: macos-26

permissions:
  contents: read
  statuses: write

concurrency:
  group: native-sim-${{ inputs.session }}
  cancel-in-progress: true

jobs:
  stream:
    runs-on: ${{ inputs.runner }}
    # GitHub caps hosted jobs at 6h; the hold step ends the session earlier.
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_CONTEXT: native-sim/${{ inputs.session }}
      GATE_PORT: "3199"
      PREVIEW_PORT: "3200"
      # The older fork rejects --allow-any-host-when-insecure. Keep the package
      # and CLI flags compatible instead of following a moving release tarball.
      SERVE_SIM_PACKAGE: '@expo/serve-sim@0.10.3'
      AGENT_PORT: "4310"
      BUILD_CONFIGURATION: ${{ (inputs.dev == 'true' || inputs.dev_url != '') && 'Debug' || 'Release' }}
      NATIVE_SIM_IPA_FILE: ''
      NATIVE_SIM_SOURCE_DIR: ${{ inputs.source != '' && '.native-sim-source' || '.' }}
      NATIVE_SIM_APP_DIR: ${{ inputs.source != '' && format('.native-sim-source/{0}', inputs.project_dir) || inputs.project_dir }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: ${{ inputs.source == '' }}

      - name: Validate framework
        run: |
          case '${{ inputs.framework }}' in
            expo|react-native|native) ;;
            *) echo "::error::unsupported framework '${{ inputs.framework }}' (expected expo, react-native, or native)"; exit 1 ;;
          esac
          if [ '${{ inputs.mode }}' = 'go' ] && [ '${{ inputs.framework }}' != 'expo' ]; then
            echo "::error::mode go is only supported with the expo framework"
            exit 1
          fi
          if [ '${{ inputs.framework }}' = 'native' ] && [ -n '${{ inputs.dev_url }}' ]; then
            echo "::error::dev_url is only supported for Expo and React Native; use dev for a native iOS Debug build"
            exit 1
          fi
          if [ '${{ inputs.export_ipa }}' = 'true' ] || [ '${{ inputs.mode }}' = ipa ]; then
            case '${{ inputs.mode }}:${{ inputs.framework }}' in
              build:expo|build:native|ipa:expo|ipa:native) ;;
              *) echo "::error::IPA export requires Expo or native iOS in build or IPA mode"; exit 1 ;;
            esac
          fi
          if [ '${{ inputs.mode }}' = ipa ] && [ '${{ inputs.agent_device }}' = true ]; then
            echo "::error::IPA-only runs cannot start a simulator agent"
            exit 1
          fi

      - name: Prepare IPA download path
        if: inputs.mode == 'ipa' || (inputs.mode == 'build' && (inputs.framework == 'native' || inputs.export_ipa == 'true'))
        run: |
          set -euo pipefail
          printf 'NATIVE_SIM_IPA_FILE=%s/native-sim-export/unsigned.ipa\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.framework == 'expo' && '22' || '20' }}

      - name: Prepare preview access
        id: preview-access
        env:
          SESSION: ${{ inputs.session }}
          LOCAL_GATE_TOKEN: ${{ inputs.gate_token }}
          PRIVATE_SOURCE: ${{ inputs.source }}
          PRIVATE_GATE_KEY: ${{ secrets.NATIVE_SIM_PRIVATE_GATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$PRIVATE_SOURCE" ]; then
            TOKEN=$(node - <<'NODE'
          const { createDecipheriv, createHmac } = require('node:crypto');
          const { PRIVATE_GATE_KEY, SESSION: session, PRIVATE_SOURCE: input } = process.env;
          const key = (PRIVATE_GATE_KEY ?? '').trim();
          if (!/^[a-f0-9]{64}$/i.test(key) || !/^[a-f0-9]{32}$/.test(session ?? '')) {
            console.error('Configure NATIVE_SIM_PRIVATE_GATE_KEY and dispatch with native-sim');
            process.exit(1);
          }
          const derive = (purpose) => createHmac('sha256', key).update('native-sim:' + purpose + ':' + session).digest();
          let source;
          try {
            const payload = Buffer.from(input, 'base64url');
            const decipher = createDecipheriv('aes-256-gcm', derive('checkout'), payload.subarray(0, 12));
            decipher.setAuthTag(payload.subarray(-16));
            source = JSON.parse(Buffer.concat([decipher.update(payload.subarray(12, -16)), decipher.final()]));
          } catch {
            console.error('Could not decrypt the source request. Check that the local and runner gate keys match.');
            process.exit(1);
          }
          const repository = source?.repository;
          const ref = source?.ref ?? '';
          const devUrl = source?.devUrl ?? '';
          if (typeof repository !== 'string' || !/^[A-Za-z0-9][A-Za-z0-9-]*\/[A-Za-z0-9_.-]+$/.test(repository) ||
              /\/\.{1,2}$/.test(repository) || typeof ref !== 'string' || (ref && !/^[A-Za-z0-9_.\/-]+$/.test(ref)) ||
              typeof devUrl !== 'string' || /[\r\n\0]/.test(devUrl)) {
            console.error('Invalid private source repository or ref');
            process.exit(1);
          }
          const fs = require('node:fs');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'repository=' + repository + '\nref=' + ref + '\n');
          fs.appendFileSync(process.env.GITHUB_ENV, 'NATIVE_SIM_PRIVATE_DEV_URL=' + devUrl + '\n');
          process.stderr.write('::add-mask::' + repository + '\n');
          if (devUrl) process.stderr.write('::add-mask::' + devUrl + '\n');
          process.stdout.write(derive('gate').toString('base64url'));
          NODE
          )
            umask 077
            LOG="$RUNNER_TEMP/native-sim-build.log"
            : > "$LOG"
            printf 'NATIVE_SIM_PRIVATE_LOG=%s\n' "$LOG" >> "$GITHUB_ENV"
            printf 'NATIVE_SIM_PRIVATE_APP_FILE=%s/native-sim-simulator.app.tar.gz\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          else
            TOKEN="$LOCAL_GATE_TOKEN"
          fi
          [ -n "$TOKEN" ] || { echo "::error::Missing preview access key"; exit 1; }
          printf '::add-mask::%s\n' "$TOKEN"
          printf 'NATIVE_SIM_GATE_TOKEN=%s\n' "$TOKEN" >> "$GITHUB_ENV"

      - name: Check private checkout configuration
        if: inputs.source != ''
        env:
          SOURCE_TOKEN: ${{ secrets.NATIVE_SIM_SOURCE_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error::Set the runner repository’s NATIVE_SIM_SOURCE_TOKEN Actions secret to a read-only token scoped to the source repo"
            exit 1
          fi
          if [ "$MODE" != build ] && [ "$MODE" != go ] && [ "$MODE" != ipa ]; then
            echo "::error::A separate source checkout requires build, IPA, or Expo Go mode"
            exit 1
          fi

      - name: Check out private source
        if: inputs.source != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.preview-access.outputs.repository }}
          ref: ${{ steps.preview-access.outputs.ref }}
          token: ${{ secrets.NATIVE_SIM_SOURCE_TOKEN }}
          path: .native-sim-source
          persist-credentials: false

      - name: Validate source directory
        if: inputs.source != ''
        run: |
          set -euo pipefail
          ROOT=$(cd "$NATIVE_SIM_SOURCE_DIR" && pwd -P)
          APP=$(cd "$NATIVE_SIM_APP_DIR" 2>/dev/null && pwd -P) || { echo "::error::Source project directory does not exist"; exit 1; }
          case "$APP" in
            "$ROOT"|"$ROOT/"*) ;;
            *) echo "::error::Source project directory must stay inside the private checkout"; exit 1 ;;
          esac

      - name: Boot simulator
        if: inputs.mode != 'ipa'
        timeout-minutes: 10
        id: sim
        run: |
          set -euo pipefail
          DEVICE='${{ inputs.device }}'

          UDID=$(xcrun simctl list devices available \
            | grep -F "$DEVICE (" \
            | head -1 \
            | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/' || true)

          if [ -z "$UDID" ]; then
            echo "::warning::'$DEVICE' not available on this image; falling back to the newest available iPhone"
            UDID=$(xcrun simctl list devices available \
              | grep -E '^\s+iPhone' \
              | tail -1 \
              | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          fi

          [ -n "$UDID" ] || { echo "No iOS simulator available on this runner image"; exit 1; }

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep -F "$UDID"

      - name: Start serve-sim
        if: inputs.mode != 'ipa'
        timeout-minutes: 10
        env:
          TURN_KEY_ID: ${{ secrets.NATIVE_SIM_TURN_KEY_ID }}
          TURN_KEY_TOKEN: ${{ secrets.NATIVE_SIM_TURN_KEY_TOKEN }}
          TURN_URL: ${{ secrets.NATIVE_SIM_TURN_URL }}
          TURN_USERNAME: ${{ secrets.NATIVE_SIM_TURN_USERNAME }}
          TURN_CREDENTIAL: ${{ secrets.NATIVE_SIM_TURN_CREDENTIAL }}
          STUN_URL: ${{ secrets.NATIVE_SIM_STUN_URL }}
        run: |
          set -euo pipefail
          if ! npx --yes "$SERVE_SIM_PACKAGE" --help > serve-sim-help.txt 2> serve-sim.log; then
            echo "::error::Could not load the serve-sim CLI"
            cat serve-sim.log >&2
            exit 1
          fi
          if ! grep -Fq -- '--allow-any-host-when-insecure' serve-sim-help.txt; then
            echo "::error::$SERVE_SIM_PACKAGE does not support --allow-any-host-when-insecure; use a compatible serve-sim package"
            exit 1
          fi
          # MJPEG re-sends a whole JPEG per frame; h264 encodes only what changed,
          # which is the difference between a choppy and a smooth tunnel stream.
          # max-dimension cuts pixels quadratically, saving encode CPU and bytes.
          ARGS=(
            --quiet
            --allow-any-host-when-insecure
            --port "$PREVIEW_PORT"
            --max-dimension '${{ inputs.max_dimension }}'
            --video-fps '${{ inputs.video_fps }}'
          )

          if [ '${{ inputs.transport }}' = 'webrtc' ] && [ -n "$TURN_KEY_ID" ]; then
            # Cloudflare Realtime mints short-lived TURN credentials, so nothing
            # long-lived is stored and a leak expires on its own.
            echo "Minting TURN credentials from Cloudflare Realtime"
            RESP=$(curl -fsS --retry 2 \
              "https://rtc.live.cloudflare.com/v1/turn/keys/$TURN_KEY_ID/credentials/generate-ice-servers" \
              -H "Authorization: Bearer $TURN_KEY_TOKEN" \
              -H 'Content-Type: application/json' \
              --data '{"ttl": 7200}')

            # iceServers is an ARRAY: entries without a username are STUN, the
            # entry carrying username/credential holds the TURN urls.
            parse() {
              printf '%s' "$RESP" | node -e '
                let s = "";
                process.stdin.on("data", (d) => (s += d)).on("end", () => {
                  const list = JSON.parse(s).iceServers || [];
                  const turn = list.find((e) => e.username) || {};
                  const stun = list.filter((e) => !e.username).flatMap((e) => [].concat(e.urls || []));
                  const out = {
                    urls: [].concat(turn.urls || []).join(","),
                    username: turn.username || "",
                    credential: turn.credential || "",
                    stun: stun.join(","),
                  };
                  process.stdout.write(out[process.argv[1]] || "");
                });
              ' "$1"
            }

            TURN_URL=$(parse urls)
            TURN_USERNAME=$(parse username)
            TURN_CREDENTIAL=$(parse credential)
            STUN_URL=$(parse stun)

            # Mask before anything else can echo them.
            echo "::add-mask::$TURN_CREDENTIAL"
            echo "::add-mask::$TURN_USERNAME"
            [ -n "$TURN_URL" ] || { echo "::error::Realtime returned no TURN urls"; exit 1; }
            echo "TURN ready: $(printf '%s' "$TURN_URL" | tr ',' '\n' | wc -l | tr -d ' ') relay url(s), $(printf '%s' "$STUN_URL" | tr ',' '\n' | wc -l | tr -d ' ') stun"
          fi

          if [ '${{ inputs.transport }}' = 'webrtc' ]; then
            # WebRTC adapts bitrate under congestion instead of dropping frames,
            # but a quick tunnel carries no UDP, so TURN is mandatory - STUN alone
            # cannot traverse it. Credentials come from repo secrets, never from
            # workflow inputs, which are visible to anyone who can read the repo.
            [ -n "$TURN_URL" ] || { echo "::error::transport webrtc needs NATIVE_SIM_TURN_URL"; exit 1; }
            ARGS+=(--transport webrtc --webrtc-codec h264 --turn-url "$TURN_URL")
            [ -n "$TURN_USERNAME" ]   && ARGS+=(--turn-username "$TURN_USERNAME")
            [ -n "$TURN_CREDENTIAL" ] && ARGS+=(--turn-credential "$TURN_CREDENTIAL")
            [ -n "$STUN_URL" ]        && ARGS+=(--stun-url "$STUN_URL")
          else
            # These target MJPEG explicitly: --video-fps only sets h264Fps, and the
            # h264/AVCC path emits no data on GitHub's macOS runners.
            ARGS+=(
              --codec '${{ inputs.codec }}'
              --mjpeg-fps '${{ inputs.video_fps }}'
              --mjpeg-quality '${{ inputs.video_quality }}'
            )
          fi

          # Do not use --detach here: serve-sim's detached child doesn't inherit
          # --allow-any-host-when-insecure, so its preview rejects the tunnel Host.
          nohup npx --yes "$SERVE_SIM_PACKAGE" "${ARGS[@]}" > serve-sim.json 2> serve-sim.log &
          SERVE_SIM_PID=$!
          disown "$SERVE_SIM_PID"

          # /readyz blocks until the simulator and the native capture session are up.
          for _ in $(seq 1 90); do
            if ! kill -0 "$SERVE_SIM_PID" 2>/dev/null; then
              echo "::error::serve-sim exited before readiness"
              cat serve-sim.log >&2 || true
              exit 1
            fi
            if curl -fsS --connect-timeout 2 --max-time 10 "http://127.0.0.1:$PREVIEW_PORT/readyz" >/dev/null 2>&1; then
              echo "serve-sim ready"
              sleep 25
              exit 0
            fi
            sleep 2
          done
          echo "serve-sim never became ready"
          curl -sS "http://127.0.0.1:$PREVIEW_PORT/healthz" || true
          cat serve-sim.log >&2 || true
          exit 1

      - name: Start auth gate
        if: inputs.mode != 'ipa' || inputs.source != ''
        timeout-minutes: 5
        env:
          # Empty disables the /agent-device route outright, so a session started
          # without --agent exposes no control surface beyond the stream.
          NATIVE_SIM_AGENT_PORT: ${{ inputs.agent_device == 'true' && '4310' || '' }}
        run: |
          set -euo pipefail
          # serve-sim has no auth of its own, so nothing but this gate stands
          # between a leaked tunnel URL and full control of the simulator.
          # The gate starts before the agent-device proxy does; until that comes
          # up, /agent-device/* simply 502s.
          NATIVE_SIM_TARGET_PORT="$PREVIEW_PORT" NATIVE_SIM_GATE_PORT="$GATE_PORT" \
            nohup node .github/native-sim/gate.cjs > gate.log 2>&1 &
          disown
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null "http://127.0.0.1:$GATE_PORT/__native-sim/healthz" && exit 0
            sleep 1
          done
          cat gate.log; exit 1

      - name: Open tunnel and publish URL
        if: inputs.mode != 'ipa' || inputs.source != ''
        timeout-minutes: 10
        id: tunnel
        env:
          RUN_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          # GitHub Releases downloads on the macOS runners occasionally die
          # mid-transfer (curl exit 56). That must not scrap the whole
          # sometimes-hours-long build, so retry transient AND hard failures.
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors -o cloudflared.tgz \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz
          tar -xzf cloudflared.tgz
          chmod +x cloudflared

          nohup ./cloudflared tunnel --no-autoupdate --url "http://127.0.0.1:$GATE_PORT" \
            --logfile cloudflared.log > /dev/null 2>&1 &
          disown

          TUNNEL=""
          for _ in $(seq 1 60); do
            TUNNEL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' cloudflared.log 2>/dev/null | head -1 || true)
            [ -n "$TUNNEL" ] && break
            sleep 2
          done
          [ -n "$TUNNEL" ] || { echo "cloudflared never reported a URL"; tail -50 cloudflared.log; exit 1; }

          echo "NATIVE_SIM_PREVIEW_URL=$TUNNEL" >> "$GITHUB_ENV"

          # Commit statuses are world-readable on a public repo, so publish the
          # bare tunnel URL only. The CLI generated the access key and appends it
          # locally; putting it here would hand anyone a working link.

          DESCRIPTION="simulator live; app still building"
          if [ "$RUN_MODE" = ipa ]; then
            DESCRIPTION="private iPhone build download ready to connect"
          fi
          # A commit status is the one channel the local CLI can read live.
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f "context=$STATUS_CONTEXT" \
            -f "target_url=$TUNNEL" \
            -f "description=$DESCRIPTION"

          echo "::notice title=native-sim::$TUNNEL (append the access key the CLI printed)"
          {
            echo "## 📱 native-sim"
            echo
            echo "$DESCRIPTION at $TUNNEL"
            echo
            echo "The access key is deliberately not published here — use the full"
            echo "URL the CLI printed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure build cache keys
        id: buildkeys
        if: inputs.source == '' && (inputs.mode == 'build' || inputs.mode == 'ipa') && inputs.cache == 'true'
        env:
          FRAMEWORK: ${{ inputs.framework }}
          PROJECT_DIR: ${{ inputs.project_dir }}
          SCHEME: ${{ inputs.scheme }}
        run: |
          set -euo pipefail
          XCODE=$(xcodebuild -version)
          BASE=$({
            printf '%s\n' "$XCODE" "$GITHUB_WORKSPACE" "$FRAMEWORK" "$PROJECT_DIR" "$SCHEME"
            xcode-select -p
            sw_vers -productVersion
            uname -m
          } | shasum -a 256 | cut -d ' ' -f 1)
          printf 'toolchain=%s\n' "$BASE" >> "$GITHUB_OUTPUT"
          if [ '${{ inputs.mode }}' = build ]; then
            SIM_SDK=$(xcrun --sdk iphonesimulator --show-sdk-build-version)
            printf 'simulator=%s\n' "$(printf '%s\n' "$BASE" "$SIM_SDK" "$BUILD_CONFIGURATION" | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          fi
          if [ '${{ inputs.export_ipa }}' = true ] || [ '${{ inputs.mode }}' = ipa ]; then
            DEVICE_SDK=$(xcrun --sdk iphoneos --show-sdk-build-version)
            printf 'device=%s\n' "$(printf '%s\n' "$BASE" "$DEVICE_SDK" Release | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          fi
          XCODE_MAJOR=$(printf '%s\n' "$XCODE" | sed -n 's/^Xcode \([0-9]*\).*/\1/p')
          if [ "${XCODE_MAJOR:-0}" -ge 26 ]; then
            echo "NATIVE_SIM_COMPILATION_CACHE=YES" >> "$GITHUB_ENV"
          fi

      - name: Restore JavaScript package downloads
        id: js-cache
        if: inputs.source == '' && inputs.mode != 'app' && inputs.framework != 'native' && inputs.cache == 'true'
        uses: actions/cache/restore@v4
        with:
          path: &js-cache-paths |
            ~/.npm
            ~/.bun/install/cache
            ~/Library/Caches/Yarn
            ~/.cache/yarn
            ~/.yarn/berry/cache
            ~/.cache/node/corepack
            ~/Library/pnpm/store
            ~/.local/share/pnpm/store
          key: native-sim-js-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml', '**/bun.lock', '**/bun.lockb', '**/package.json', '**/pnpm-workspace.yaml', '**/.yarnrc.yml') }}
          restore-keys: native-sim-js-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install JS dependencies
        timeout-minutes: 20
        if: inputs.mode != 'app' && inputs.framework != 'native'
        working-directory: ${{ env.NATIVE_SIM_SOURCE_DIR }}
        run: |
          set -euo pipefail
          if [ -n "${NATIVE_SIM_PRIVATE_LOG:-}" ]; then
            echo "Installing dependencies. Full output is in the authenticated preview."
            exec >> "$NATIVE_SIM_PRIVATE_LOG" 2>&1
          fi
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            curl -fsSL https://bun.sh/install | bash
            echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.bun/bin:$PATH"
            bun install --frozen-lockfile
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable && pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            # --immutable is Yarn 2+; Yarn 1 wants --frozen-lockfile.
            yarn install --immutable || yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Fingerprint native build inputs
        id: fp
        if: steps.buildkeys.outputs.toolchain != ''
        timeout-minutes: 5
        working-directory: ${{ inputs.project_dir }}
        env:
          NATIVE_SCHEME: ${{ inputs.scheme }}
        run: |
          set -euo pipefail
          if [ '${{ inputs.framework }}' = 'native' ]; then
            # Every tracked source/resource can change a native app. Hash the
            # whole checkout to include local Swift packages outside project_dir.
            # Xcode and scheme also affect the binary; no JS tooling is needed.
            HASH=$({
              git -C "$GITHUB_WORKSPACE" ls-files --stage
              xcodebuild -version
              printf '%s\n' "$NATIVE_SCHEME"
            } | shasum -a 256 | awk '{print $1}')
          else
            # Expo/RN fingerprints ignore JS, which is re-bundled on cache hits.
            HASH=$(npx --yes @expo/fingerprint fingerprint:generate --platform ios \
              | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0,"utf8")).hash)')
          fi
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "native fingerprint: $HASH"

      - name: Restore cached app build
        id: appcache
        if: inputs.source == '' && inputs.mode == 'build' && inputs.cache == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ inputs.project_dir }}/build/native-sim-app
          key: native-sim-app-v2-${{ steps.buildkeys.outputs.simulator }}-${{ steps.fp.outputs.hash }}

      - name: Restore CocoaPods downloads
        id: pod-downloads
        if: steps.buildkeys.outputs.toolchain != '' && inputs.framework != 'native' && (steps.appcache.outputs.cache-hit != 'true' || inputs.export_ipa == 'true')
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: native-sim-pod-downloads-v1-${{ runner.arch }}-${{ steps.fp.outputs.hash }}
          restore-keys: native-sim-pod-downloads-v1-${{ runner.arch }}-

      - name: Check whether Pods are generated
        id: pods
        if: steps.buildkeys.outputs.toolchain != '' && inputs.framework != 'native' && (steps.appcache.outputs.cache-hit != 'true' || inputs.export_ipa == 'true')
        working-directory: ${{ inputs.project_dir }}
        run: |
          if [ -z "$(git ls-files -- ios/Pods)" ]; then
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore installed CocoaPods
        id: pod-cache
        if: steps.pods.outputs.generated == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ inputs.project_dir }}/ios/Pods
          key: native-sim-pods-v1-${{ steps.buildkeys.outputs.toolchain }}-${{ steps.fp.outputs.hash }}

      - name: Restore Swift packages
        id: swift-packages
        if: steps.buildkeys.outputs.toolchain != '' && (steps.appcache.outputs.cache-hit != 'true' || inputs.ssh == 'true' || steps.buildkeys.outputs.device != '')
        uses: actions/cache/restore@v4
        with:
          path: ${{ inputs.project_dir }}/build/native-sim-source-packages
          key: native-sim-swiftpm-v1-${{ steps.buildkeys.outputs.toolchain }}-${{ hashFiles('**/Package.resolved', '**/Package.swift', '**/*.pbxproj') }}
          restore-keys: native-sim-swiftpm-v1-${{ steps.buildkeys.outputs.toolchain }}-

      - name: Restore simulator Xcode build data
        id: sim-xcode
        if: steps.buildkeys.outputs.simulator != '' && (steps.appcache.outputs.cache-hit != 'true' || inputs.ssh == 'true')
        uses: actions/cache/restore@v4
        with:
          path: &sim-xcode-paths |
            ${{ inputs.project_dir }}/build/ios/Build
            ${{ inputs.project_dir }}/build/ios/ModuleCache.noindex
            ${{ inputs.project_dir }}/build/ios/SDKStatCaches.noindex
            ${{ inputs.project_dir }}/build/ios/CompilationCache.noindex
            ${{ inputs.project_dir }}/build/ios/native-sim-mtimes.json
          key: native-sim-xcode-simulator-v1-${{ steps.buildkeys.outputs.simulator }}-${{ github.sha }}
          restore-keys: native-sim-xcode-simulator-v1-${{ steps.buildkeys.outputs.simulator }}-

      - name: Restore Xcode input timestamps for SSH
        if: inputs.ssh == 'true' && steps.appcache.outputs.cache-hit == 'true' && steps.sim-xcode.outputs.cache-matched-key != ''
        working-directory: ${{ inputs.project_dir }}
        run: |
          if [ -f build/ios/native-sim-mtimes.json ]; then
            python3 "$GITHUB_WORKSPACE/.github/native-sim/xcode-mtimes.py" restore build/ios
          fi

      - name: Restore private iPhone build cache from R2
        id: r2-device-cache
        if: inputs.source != '' && inputs.cache == 'true' && (inputs.mode == 'ipa' || (inputs.mode == 'build' && inputs.export_ipa == 'true'))
        working-directory: ${{ env.NATIVE_SIM_APP_DIR }}
        timeout-minutes: 12
        continue-on-error: true
        env:
          R2_CACHE_ENDPOINT: ${{ secrets.NATIVE_SIM_R2_ENDPOINT }}
          R2_CACHE_BUCKET: ${{ secrets.NATIVE_SIM_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.NATIVE_SIM_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NATIVE_SIM_R2_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_CACHE_SOURCE: ${{ steps.preview-access.outputs.repository }}
          R2_CACHE_FRAMEWORK: ${{ inputs.framework }}
          SCHEME: ${{ inputs.scheme }}
        run: python3 "$GITHUB_WORKSPACE/.github/native-sim/r2-device-cache.py" restore

      - name: Prepare native iOS development shell
        if: inputs.ssh == 'true' && inputs.framework == 'native' && inputs.mode == 'build'
        env:
          PROJECT_DIR: ${{ env.NATIVE_SIM_APP_DIR }}
          SCHEME: ${{ inputs.scheme }}
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/native-sim-dev.env"
          umask 077
          {
            printf 'NATIVE_SIM_PROJECT_DIR=%q\n' "$GITHUB_WORKSPACE/$PROJECT_DIR"
            printf 'NATIVE_SIM_SCHEME=%q\n' "$SCHEME"
            printf 'NATIVE_SIM_UDID=%q\n' "$UDID"
            printf 'NATIVE_SIM_CONFIGURATION=%q\n' "$BUILD_CONFIGURATION"
            printf 'NATIVE_SIM_COMPILATION_CACHE=%q\n' "${NATIVE_SIM_COMPILATION_CACHE:-}"
          } > "$CONFIG"
          echo "NATIVE_SIM_DEV_CONFIG=$CONFIG" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.local/bin"
          chmod +x "$GITHUB_WORKSPACE/.github/native-sim/rebuild-ios.sh"
          chmod +x "$GITHUB_WORKSPACE/.github/native-sim/export-ipa.sh"
          ln -sf "$GITHUB_WORKSPACE/.github/native-sim/rebuild-ios.sh" "$HOME/.local/bin/native-sim-rebuild"
          ln -sf "$GITHUB_WORKSPACE/.github/native-sim/export-ipa.sh" "$HOME/.local/bin/native-sim-export-ipa"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "After connecting over SSH, edit Swift files and run native-sim-rebuild."
          echo "To export your edited app for Windows, run native-sim-export-ipa."

      - name: Start Upterm SSH session
        id: ssh
        if: inputs.ssh == 'true'
        uses: owenthereal/action-upterm@b9dfa526f890bbd5162d781f8d9c69b97731d73d # v2.7.0
        with:
          detached: true
          limit-access-to-actor: true
          upterm-version: v0.39.0
          wait-timeout-minutes: ${{ inputs.minutes }}

      - name: Prebuild Expo iOS project
        if: inputs.framework == 'expo' && (inputs.mode == 'build' || inputs.mode == 'ipa')
        timeout-minutes: 20
        working-directory: ${{ env.NATIVE_SIM_APP_DIR }}
        env:
          NEEDS_PODS: ${{ steps.appcache.outputs.cache-hit != 'true' || inputs.export_ipa == 'true' }}
        run: |
          set -euo pipefail
          if [ -n "${NATIVE_SIM_PRIVATE_LOG:-}" ]; then
            echo "Preparing the private Expo iOS project. Full output is in the authenticated preview."
            exec >> "$NATIVE_SIM_PRIVATE_LOG" 2>&1
          fi
          CI=1 npx expo prebuild --platform ios --no-install
          if [ "$NEEDS_PODS" = true ]; then
            npx pod-install ios
          fi

      - name: Build app
        id: build-app
        timeout-minutes: 60
        working-directory: ${{ env.NATIVE_SIM_APP_DIR }}
        if: inputs.mode == 'build' && steps.appcache.outputs.cache-hit != 'true'
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          RCT_NO_LAUNCH_PACKAGER: ${{ inputs.framework == 'react-native' && '1' || '' }}
          SCHEME: ${{ inputs.scheme }}
          NATIVE_SIM_RESTORED_XCODE: ${{ steps.sim-xcode.outputs.cache-matched-key != '' }}
          NATIVE_SIM_SAVE_MTIMES: ${{ steps.sim-xcode.outputs.cache-primary-key != '' && steps.sim-xcode.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          if [ -n "${NATIVE_SIM_PRIVATE_LOG:-}" ]; then
            echo "Building the private app. Full output is in the authenticated preview."
            exec >> "$NATIVE_SIM_PRIVATE_LOG" 2>&1
          fi
          if [ '${{ inputs.framework }}' = 'native' ]; then
            # Native SwiftUI/UIKit apps need neither package.json nor Podfile.
            # Prefer an app workspace, then a project, in ios/ or the app root.
            CONTAINER=""
            for NATIVE_DIR in ios .; do
              [ -d "$NATIVE_DIR" ] || continue
              CANDIDATES=()
              for WORKSPACE in "$NATIVE_DIR"/*.xcworkspace; do
                if [ -f "$WORKSPACE/contents.xcworkspacedata" ]; then
                  CANDIDATES+=("$WORKSPACE")
                fi
              done
              if [ "${#CANDIDATES[@]}" -eq 0 ]; then
                for PROJECT in "$NATIVE_DIR"/*.xcodeproj; do
                  if [ -f "$PROJECT/project.pbxproj" ]; then
                    CANDIDATES+=("$PROJECT")
                  fi
                done
              fi
              if [ "${#CANDIDATES[@]}" -gt 1 ]; then
                echo "::error::Multiple Xcode projects or workspaces in $NATIVE_DIR; use project_dir to select one app directory"
                exit 1
              fi
              if [ "${#CANDIDATES[@]}" -eq 1 ]; then
                CONTAINER="${CANDIDATES[0]}"
                break
              fi
            done
            [ -n "$CONTAINER" ] || { echo "::error::No .xcodeproj or .xcworkspace found in ios/ or the app root"; exit 1; }
          else
            if [ '${{ inputs.framework }}' = 'react-native' ]; then
              npx pod-install ios
            fi
            CONTAINER=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -1)
            [ -n "$CONTAINER" ] || { echo "No .xcworkspace found after CocoaPods install"; exit 1; }
          fi

          case "$CONTAINER" in
            *.xcworkspace) XCODE_ARGS=(-workspace "$CONTAINER"); DEFAULT_SCHEME=$(basename "$CONTAINER" .xcworkspace) ;;
            *.xcodeproj) XCODE_ARGS=(-project "$CONTAINER"); DEFAULT_SCHEME=$(basename "$CONTAINER" .xcodeproj) ;;
          esac
          [ -n "$SCHEME" ] || SCHEME="$DEFAULT_SCHEME"
          echo "Building scheme '$SCHEME' from $CONTAINER"

          XCODE_CACHE_ARGS=()
          if [ "${NATIVE_SIM_COMPILATION_CACHE:-}" = YES ]; then
            XCODE_CACHE_ARGS+=(COMPILATION_CACHE_ENABLE_CACHING=YES "COMPILATION_CACHE_CAS_PATH=$PWD/build/ios/CompilationCache.noindex")
          fi
          if [ "${NATIVE_SIM_RESTORED_XCODE:-}" = true ] && [ -f build/ios/native-sim-mtimes.json ]; then
            python3 "$GITHUB_WORKSPACE/.github/native-sim/xcode-mtimes.py" restore build/ios
          fi
          PRODUCTS="build/ios/Build/Products/$BUILD_CONFIGURATION-iphonesimulator"
          # A restored product may belong to an old app target or JS bundle.
          # Reassemble the app while keeping the expensive object files.
          if [ "${NATIVE_SIM_RESTORED_XCODE:-}" = true ] && [ -d "$PRODUCTS" ]; then
            find "$PRODUCTS" -maxdepth 1 -type d -name '*.app' -exec rm -rf {} +
          fi

          xcodebuild \
            "${XCODE_ARGS[@]}" \
            -scheme "$SCHEME" \
            -configuration "$BUILD_CONFIGURATION" \
            -sdk iphonesimulator \
            -destination "id=$UDID" \
            -derivedDataPath build/ios \
            -clonedSourcePackagesDirPath "$PWD/build/native-sim-source-packages" \
            CODE_SIGNING_ALLOWED=NO \
            ${XCODE_CACHE_ARGS[@]+"${XCODE_CACHE_ARGS[@]}"} \
            -quiet \
            build

          APP=$(find "$PRODUCTS" -maxdepth 1 -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "No .app produced"; exit 1; }

          # Park the bundle where the cache (and the install step) expect it.
          rm -rf build/native-sim-app
          mkdir -p build/native-sim-app
          cp -R "$APP" build/native-sim-app/

          if [ "${NATIVE_SIM_SAVE_MTIMES:-}" = true ]; then
            python3 "$GITHUB_WORKSPACE/.github/native-sim/xcode-mtimes.py" save build/ios
          fi

      - name: Export app archive
        working-directory: ${{ env.NATIVE_SIM_APP_DIR }}
        if: inputs.mode == 'build' && inputs.export_app == 'true'
        run: |
          set -euo pipefail
          if [ -n "${NATIVE_SIM_PRIVATE_LOG:-}" ]; then
            exec >> "$NATIVE_SIM_PRIVATE_LOG" 2>&1
          fi
          APP=$(find build/native-sim-app -maxdepth 1 -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "::error::nothing to export"; exit 1; }
          # Tar it: upload-artifact zips its input, and a zipped .app directory
          # loses the executable bits simctl needs.
          if [ -n "${NATIVE_SIM_PRIVATE_APP_FILE:-}" ]; then
            tar -C build/native-sim-app -czf "$NATIVE_SIM_PRIVATE_APP_FILE.partial" "$(basename "$APP")"
            mv -f "$NATIVE_SIM_PRIVATE_APP_FILE.partial" "$NATIVE_SIM_PRIVATE_APP_FILE"
          else
            tar -C build/native-sim-app -czf "build/$(basename "$APP").tar.gz" "$(basename "$APP")"
            ls -lh build/*.tar.gz
          fi

      - name: Upload app artifact
        if: inputs.source == '' && inputs.mode == 'build' && inputs.export_app == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: native-sim-app-${{ inputs.session }}
          path: ${{ inputs.project_dir }}/build/*.app.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Install and launch app
        timeout-minutes: 15
        working-directory: ${{ env.NATIVE_SIM_APP_DIR }}
        if: inputs.mode == 'build'
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          CACHE_HIT: ${{ steps.appcache.outputs.cache-hit }}
          DEV_URL: ${{ inputs.dev_url }}
        run: |
          set -euo pipefail
          if [ -n "${NATIVE_SIM_PRIVATE_LOG:-}" ]; then
            exec >> "$NATIVE_SIM_PRIVATE_LOG" 2>&1
          fi
          DEV_URL="${NATIVE_SIM_PRIVATE_DEV_URL:-$DEV_URL}"
          APP=$(find build/native-sim-app -maxdepth 1 -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "No .app to install"; exit 1; }

          if [ '${{ inputs.framework }}' != 'native' ] && [ "$CACHE_HIT" = "true" ] && [ "$BUILD_CONFIGURATION" = "Release" ]; then
            # The fingerprint ignores app JS, so a reused binary carries a stale
            # bundle. Re-embed current JS rather than rebuilding natively.
            echo "Reused cached native build; refreshing the JS bundle"
            if [ '${{ inputs.framework }}' = 'expo' ]; then
              npx expo export:embed \
                --platform ios \
                --dev false \
                --bundle-output "$APP/main.jsbundle" \
                --assets-dest "$APP"
            else
              npx react-native bundle \
                --platform ios \
                --dev false \
                --entry-file index.js \
                --bundle-output "$APP/main.jsbundle" \
                --assets-dest "$APP"
            fi
          fi

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$UDID" "$APP"
          if [ '${{ inputs.framework }}' = 'react-native' ] && [ -n "$DEV_URL" ]; then
            # The RN CLI app requests Metro at localhost:8081. Bridge that
            # simulator port to the developer's public HTTPS Metro tunnel.
            brew install caddy
            nohup caddy reverse-proxy --from :8081 --to "$DEV_URL" > caddy.log 2>&1 &
            disown
            for _ in $(seq 1 30); do
              curl -fsS --max-time 2 http://127.0.0.1:8081/status >/dev/null 2>&1 && break
              sleep 1
            done
            curl -fsS --max-time 5 http://127.0.0.1:8081/status >/dev/null \
              || { echo "::error::Metro tunnel is not responding through the runner proxy"; cat caddy.log; exit 1; }
          fi
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          if [ -n "$DEV_URL" ]; then
            if [ '${{ inputs.framework }}' = 'expo' ]; then
              xcrun simctl openurl "$UDID" "$DEV_URL"
              echo "Opened Expo development client; keep local Metro and its tunnel running"
            else
              echo "RN Metro tunnel proxy is ready on localhost:8081; keep Metro and its tunnel running"
            fi
          elif [ "$BUILD_CONFIGURATION" = "Debug" ]; then
            if [ '${{ inputs.framework }}' = 'expo' ]; then
              echo "Development launcher ready; enter your public Metro URL manually"
            elif [ '${{ inputs.framework }}' = 'react-native' ]; then
              echo "React Native Debug app launched; configure Metro from the React Native Dev Menu"
            else
              echo "Native iOS Debug app launched"
            fi
          fi
          echo "Launched $BUNDLE_ID"

      - name: Save app build to cache
        if: steps.build-app.outcome == 'success' && steps.appcache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ inputs.project_dir }}/build/native-sim-app
          key: ${{ steps.appcache.outputs.cache-primary-key }}

      - name: Save simulator Xcode build data
        if: steps.build-app.outcome == 'success' && steps.sim-xcode.outputs.cache-primary-key != '' && steps.sim-xcode.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: *sim-xcode-paths
          key: ${{ steps.sim-xcode.outputs.cache-primary-key }}

      - name: Save installed CocoaPods
        if: steps.pod-cache.outputs.cache-primary-key != '' && steps.pod-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ inputs.project_dir }}/ios/Pods
          key: ${{ steps.pod-cache.outputs.cache-primary-key }}

      - name: Save CocoaPods downloads
        if: steps.pod-downloads.outputs.cache-primary-key != '' && steps.pod-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ steps.pod-downloads.outputs.cache-primary-key }}

      - name: Save JavaScript package downloads
        if: steps.js-cache.outputs.cache-primary-key != '' && steps.js-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: *js-cache-paths
          key: ${{ steps.js-cache.outputs.cache-primary-key }}

      - name: Restore device Xcode build data
        id: device-xcode
        if: steps.buildkeys.outputs.device != ''
        uses: actions/cache/restore@v4
        with:
          path: &device-xcode-paths |
            ${{ inputs.project_dir }}/build/native-sim-device/Build
            ${{ inputs.project_dir }}/build/native-sim-device/ModuleCache.noindex
            ${{ inputs.project_dir }}/build/native-sim-device/SDKStatCaches.noindex
            ${{ inputs.project_dir }}/build/native-sim-device/CompilationCache.noindex
            ${{ inputs.project_dir }}/build/native-sim-device/native-sim-mtimes.json
          key: native-sim-xcode-device-v1-${{ steps.buildkeys.outputs.device }}-${{ github.sha }}
          restore-keys: native-sim-xcode-device-v1-${{ steps.buildkeys.outputs.device }}-

      - name: Build unsigned device IPA
        id: device-build
        if: inputs.mode == 'ipa' || (inputs.mode == 'build' && inputs.export_ipa == 'true')
        timeout-minutes: 60
        env:
          PROJECT_DIR: ${{ env.NATIVE_SIM_APP_DIR }}
          SCHEME: ${{ inputs.scheme }}
          RCT_NO_LAUNCH_PACKAGER: ${{ inputs.framework == 'expo' && '1' || '' }}
          NATIVE_SIM_RESTORED_XCODE: ${{ steps.r2-device-cache.outputs.restored == 'true' || steps.device-xcode.outputs.cache-matched-key != '' }}
          NATIVE_SIM_SAVE_MTIMES: ${{ steps.r2-device-cache.outputs.key != '' || (steps.device-xcode.outputs.cache-primary-key != '' && steps.device-xcode.outputs.cache-hit != 'true') }}
          R2_DEVICE_COMPILATION_CACHE: ${{ steps.r2-device-cache.outputs.compilation-cache }}
        run: |
          set -euo pipefail
          if [ -n "${NATIVE_SIM_PRIVATE_LOG:-}" ]; then
            echo "Building the private device IPA. Full output is in the authenticated preview."
            exec >> "$NATIVE_SIM_PRIVATE_LOG" 2>&1
          fi
          export NATIVE_SIM_PROJECT_DIR="$GITHUB_WORKSPACE/$PROJECT_DIR"
          export NATIVE_SIM_SOURCE_ROOT="$GITHUB_WORKSPACE/$NATIVE_SIM_SOURCE_DIR"
          export NATIVE_SIM_SCHEME="$SCHEME"
          if [ "$R2_DEVICE_COMPILATION_CACHE" = YES ]; then
            export NATIVE_SIM_COMPILATION_CACHE=YES
          fi
          bash "$GITHUB_WORKSPACE/.github/native-sim/export-ipa.sh"

      - name: Publish private IPA to R2
        if: inputs.source != '' && steps.device-build.outcome == 'success'
        timeout-minutes: 8
        continue-on-error: true
        env:
          R2_CACHE_ENDPOINT: ${{ secrets.NATIVE_SIM_R2_ENDPOINT }}
          R2_CACHE_BUCKET: ${{ secrets.NATIVE_SIM_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.NATIVE_SIM_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NATIVE_SIM_R2_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: python3 "$GITHUB_WORKSPACE/.github/native-sim/r2-device-cache.py" publish

      - name: Save private iPhone build cache to R2
        if: steps.device-build.outcome == 'success' && steps.r2-device-cache.outputs.key != ''
        working-directory: ${{ env.NATIVE_SIM_APP_DIR }}
        timeout-minutes: 12
        continue-on-error: true
        env:
          R2_CACHE_ENDPOINT: ${{ secrets.NATIVE_SIM_R2_ENDPOINT }}
          R2_CACHE_BUCKET: ${{ secrets.NATIVE_SIM_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.NATIVE_SIM_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NATIVE_SIM_R2_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_CACHE_KEY: ${{ steps.r2-device-cache.outputs.key }}
        run: python3 "$GITHUB_WORKSPACE/.github/native-sim/r2-device-cache.py" save

      - name: Upload unsigned IPA
        if: inputs.source == '' && steps.device-build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: native-sim-ipa-${{ inputs.session }}
          path: ${{ env.NATIVE_SIM_IPA_FILE }}
          if-no-files-found: error
          retention-days: 7

      - name: Save device Xcode build data
        if: steps.device-xcode.outputs.cache-primary-key != '' && steps.device-xcode.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: *device-xcode-paths
          key: ${{ steps.device-xcode.outputs.cache-primary-key }}

      - name: Save Swift packages
        if: steps.swift-packages.outputs.cache-primary-key != '' && steps.swift-packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ inputs.project_dir }}/build/native-sim-source-packages
          key: ${{ steps.swift-packages.outputs.cache-primary-key }}

      - name: Install prebuilt app
        timeout-minutes: 15
        if: inputs.mode == 'app'
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          APP_URL: ${{ inputs.app_url }}
          APP_RELEASE_ASSET: ${{ inputs.app_release_asset }}
          APP_RELEASE_TAG: native-sim-build
        run: |
          set -euo pipefail
          [ -n "$APP_URL" ] || [ -n "$APP_RELEASE_ASSET" ] \
            || { echo "::error::mode 'app' requires app_url or app_release_asset"; exit 1; }

          mkdir -p build/prebuilt && cd build/prebuilt

          if [ -n "$APP_RELEASE_ASSET" ]; then
            # Hosted on this repo's own release. The job token is already scoped
            # here, so a private repo costs no extra credential.
            #
            # This job runs with `contents: read`, and GitHub only returns draft
            # releases to callers with push access — so a draft `native-sim-build`
            # release 404s here no matter how healthy the upload looked. native-sim
            # publishes the release for that reason; say so plainly if one is still
            # a draft, rather than dying on a bare "release not found".
            echo "Downloading $APP_RELEASE_ASSET from release $APP_RELEASE_TAG"
            if ! gh release download "$APP_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$APP_RELEASE_ASSET" \
              --output download.bin \
              --clobber
            then
              echo "::error::could not download $APP_RELEASE_ASSET from release $APP_RELEASE_TAG."
              echo "::error::If that release is a draft, this job cannot read it (contents: read)."
              echo "::error::Publish it:  gh release edit $APP_RELEASE_TAG --draft=false"
              echo "::error::Or upgrade native-sim, which now publishes it for you."
              exit 1
            fi
          else
            echo "Downloading prebuilt app"
            curl -fsSL --retry 3 -o download.bin "$APP_URL"
          fi
          file download.bin

          # EAS simulator builds ship as .tar.gz; some tooling emits .zip.
          case "$(file -b --mime-type download.bin)" in
            application/gzip|application/x-gzip) tar -xzf download.bin ;;
            application/zip)                     unzip -q download.bin ;;
            *) echo "::error::unrecognised archive; expected .tar.gz or .zip of a simulator .app"; exit 1 ;;
          esac

          APP=$(find . -maxdepth 3 -type d -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "::error::no .app found in the archive"; exit 1; }

          # A device .ipa cannot run on a simulator; catch that early with a clear message.
          if [ ! -f "$APP/Info.plist" ]; then
            echo "::error::$APP has no Info.plist — is this a simulator build?"; exit 1
          fi
          if ! /usr/libexec/PlistBuddy -c 'Print CFBundleSupportedPlatforms:0' "$APP/Info.plist" 2>/dev/null | grep -q Simulator; then
            echo "::error::this build targets a device, not a simulator. Build with the EAS 'simulator' profile (ios.simulator: true)."
            exit 1
          fi

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          echo "Launched $BUNDLE_ID from prebuilt archive"

      - name: Start Expo Go
        working-directory: ${{ env.NATIVE_SIM_APP_DIR }}
        timeout-minutes: 15
        if: inputs.mode == 'go'
        run: |
          set -euo pipefail
          # `expo start --ios` targets the already-booted simulator and installs
          # Expo Go itself. Metro stays local to the runner.
          LOG="${NATIVE_SIM_PRIVATE_LOG:-expo-start.log}"
          CI=1 nohup npx expo start --ios >> "$LOG" 2>&1 &
          disown
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8081/status >/dev/null 2>&1 && break
            sleep 2
          done
          if [ -z "${NATIVE_SIM_PRIVATE_LOG:-}" ]; then
            tail -20 "$LOG" || true
          fi

      - name: Report app installed
        if: inputs.mode == 'build' || inputs.mode == 'app'
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f "context=$STATUS_CONTEXT" \
            -f "description=app installed and running" || true

      - name: Install agent-device
        id: ad
        if: inputs.agent_device == 'true'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          npm install -g "agent-device@${{ inputs.agent_device_version }}"
          agent-device --version
          # The runner cache key has to pin the Xcode version too: an XCTest
          # runner built against a different Xcode is not reusable.
          echo "xcode=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache agent-device XCTest runner
        if: inputs.source == '' && inputs.agent_device == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.agent-device/apple-runner/derived
          # Exact key, no restore-keys: agent-device documents that broad
          # fallbacks hand back a runner built for another toolchain, which is
          # worse than building one from scratch.
          key: agent-device-runner-${{ runner.os }}-${{ inputs.agent_device_version }}-${{ steps.ad.outputs.xcode }}

      - name: Start agent-device proxy
        if: inputs.agent_device == 'true'
        timeout-minutes: 15
        env:
          # Both default to 300000ms, so the daemon and the XCTest runner are
          # reaped five minutes after the last command — measured here as a
          # session that was healthy at 13:32:36 and gone by 13:37:44, before
          # the agent ever issued its first command. Health probes do not count
          # as activity. 0 means "run until killed", which is right for native-sim:
          # the hold loop *is* the session and the VM is destroyed with it, so
          # there is nothing to leak by staying up.
          AGENT_DEVICE_DAEMON_IDLE_TIMEOUT_MS: "0"
          AGENT_DEVICE_IOS_RUNNER_IDLE_STOP_MS: "0"
          # A second, independent timer: the *device lease* taken by `open`
          # expires after five minutes without commands, and every later command
          # then fails UNAUTHORIZED ("Lease does not match session owner"). That
          # default protects a shared Mac from an agent that wandered off; here
          # the device is single-tenant and dies with the VM, so hold the lease
          # for the job cap instead. Max must move too, or it clamps the default.
          AGENT_DEVICE_LEASE_TTL_MS: "21600000"
          AGENT_DEVICE_LEASE_MAX_TTL_MS: "21600000"
        run: |
          set -euo pipefail
          # `proxy` serves the daemon HTTP contract under /agent-device/*, which
          # is the base path `connect proxy` expects behind a shared origin — so
          # it rides the tunnel that is already open instead of needing its own.
          # It reuses the gate token: one secret covers both stream and control.
          nohup agent-device proxy --host 127.0.0.1 --port "$AGENT_PORT" \
            --daemon-auth-token "$NATIVE_SIM_GATE_TOKEN" > agent-device-proxy.log 2>&1 &
          disown

          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null "http://127.0.0.1:$AGENT_PORT/health" && break
            sleep 1
          done
          curl -fsS "http://127.0.0.1:$AGENT_PORT/health" \
            || { echo "::error::agent-device proxy never became healthy"; cat agent-device-proxy.log; exit 1; }
          echo "agent-device proxy listening on 127.0.0.1:$AGENT_PORT"

          # Apple CI wants the XCTest runner built before the first interaction,
          # or the agent's opening snapshot pays several minutes of setup. Run it
          # against the daemon the proxy already started (`proxy` starts *or
          # reuses* one) so no second daemon holds a competing runner lease.
          # 240000 was too tight: a cold build measured 3m40s on one runner and
          # blew past 4 minutes on the next. On timeout agent-device kills the
          # xcodebuild it started, and that takes the daemon down with it — so a
          # tight timeout does not degrade gracefully, it removes the whole
          # agent surface. Give a cold build real room; a cache hit returns in
          # seconds regardless.
          if agent-device prepare ios-runner --platform ios --timeout 900000; then
            echo "XCTest runner ready"
          else
            echo "::warning::prepare ios-runner failed — the supervisor below will restart the daemon"
            tail -40 agent-device-proxy.log || true
          fi

      - name: Hold the stream open
        # An SSH session can stay open after build failures and without a tunnel.
        if: ${{ !cancelled() && (steps.ssh.outcome == 'success' || (steps.tunnel.outcome == 'success' && (success() || inputs.source != ''))) }}
        env:
          RUN_MODE: ${{ inputs.mode }}
          TUNNEL_READY: ${{ steps.tunnel.outcome == 'success' }}
          SSH_READY: ${{ steps.ssh.outcome == 'success' }}
          AGENT_ENABLED: ${{ inputs.agent_device }}
          AGENT_DEVICE_DAEMON_IDLE_TIMEOUT_MS: "0"
          AGENT_DEVICE_IOS_RUNNER_IDLE_STOP_MS: "0"
          AGENT_DEVICE_LEASE_TTL_MS: "21600000"
          AGENT_DEVICE_LEASE_MAX_TTL_MS: "21600000"
        run: |
          set -uo pipefail
          MINUTES=${{ inputs.minutes }}
          [ "$MINUTES" -le 350 ] || MINUTES=350
          END=$(( $(date +%s) + MINUTES * 60 ))
          AGENT_LAST_RESTART=0

          HEALTH_URL=""
          if [ "$TUNNEL_READY" = true ]; then
            if [ "$RUN_MODE" = ipa ]; then
              HEALTH_URL="http://127.0.0.1:$GATE_PORT/__native-sim/healthz"
            else
              HEALTH_URL="http://127.0.0.1:$PREVIEW_PORT/healthz"
            fi
          fi
          echo "Keeping the session open until $(date -r "$END")"
          while [ "$(date +%s)" -lt "$END" ]; do
            if [ -n "$HEALTH_URL" ] && ! curl -fsS -o /dev/null "$HEALTH_URL"; then
              echo "::error::Session server stopped responding"
              [ "$SSH_READY" = true ] || exit 1
              HEALTH_URL=""
            fi
            # A dead agent proxy is not worth tearing down a working stream for,
            # but it should not fail silently either — the agent would just see
            # its next command hang. Warn once and keep streaming.
            # The proxy answers 200 with {"ok":false} when its daemon is gone, so
            # the body has to be inspected — `curl -f` alone reports that as
            # success and the agent surface dies silently.
            #
            # The daemon has died for two unrelated reasons already (idle reap,
            # and a killed xcodebuild taking it down), so rather than enumerate
            # causes, supervise it: whenever it is not healthy, restart it. The
            # session outlives any single daemon that way. Rate-limited to one
            # attempt a minute so a permanently broken daemon does not spin.
            if [ "$AGENT_ENABLED" = "true" ] \
               && ! curl -fsS -m 10 "http://127.0.0.1:$AGENT_PORT/health" 2>/dev/null \
                  | grep -q '"ok":true'; then
              NOW=$(date +%s)
              if [ $(( NOW - AGENT_LAST_RESTART )) -ge 60 ]; then
                echo "::warning::agent-device daemon unhealthy; restarting it"
                AGENT_LAST_RESTART=$NOW
                pkill -f 'agent-device proxy' 2>/dev/null || true
                agent-device daemon stop --clean >/dev/null 2>&1 || true
                nohup agent-device proxy --host 127.0.0.1 --port "$AGENT_PORT" \
                  --daemon-auth-token "$NATIVE_SIM_GATE_TOKEN" >> agent-device-proxy.log 2>&1 &
                disown
              fi
            fi
            sleep 15
          done
          echo "Session window elapsed"

      - name: Close SSH session
        if: always() && inputs.ssh == 'true'
        run: |
          # Let Upterm's post step finish immediately when the stream expires.
          touch "$GITHUB_WORKSPACE/continue"

      - name: Mark session ended
        if: always()
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=failure \
            -f "context=$STATUS_CONTEXT" \
            -f "description=session ended" || true
